<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links · Liga de Mercado Financeiro UTFPR</title>
<meta name="description" content="Todos os links da Liga de Mercado Financeiro UTFPR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{min-height:100vh;background:linear-gradient(180deg,rgba(7,13,24,.82),var(--bg) 70%),url(img/touro.jpg) center top/cover fixed}
  .bio{max-width:520px;margin:0 auto;padding:64px 16px 40px;text-align:center}
  .bio .logo-mark{width:84px;height:84px;font-size:2.6rem;margin:0 auto 1.2rem;background:rgba(7,13,24,.6)}
  .bio h1{font-size:1.7rem;margin-bottom:.4rem}
  .bio p{color:var(--muted);font-size:.92rem;margin-bottom:2rem}
  .bio .link-grid{grid-template-columns:1fr;text-align:left}
  .bio .link-item{backdrop-filter:blur(8px);background:rgba(17,29,51,.85)}
  .bio .link-item.featured{background:var(--gold)}
  .bio .site{margin-top:2rem;display:inline-block;color:var(--gold);font-size:.9rem}
</style>
</head>
<body>
  <main class="bio">
    <div class="logo-mark">L</div>
    <h1>Liga de Mercado Financeiro UTFPR</h1>
    <p>Educação financeira e mercado de capitais · UTFPR Apucarana</p>
    <div id="links-list" class="link-grid"></div>
    <a class="site" href="index.html">Conheça nosso site →</a>
  </main>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
